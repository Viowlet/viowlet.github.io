:root{--bg:#090909;--fg:#eee;--muted:#858585;--line:#292929;--pad:clamp(20px,4vw,58px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Fixedsys Excelsior",monospace;font-weight:400;font-size:16px;
min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a,a:link,a:visited,a:hover,a:active{color:inherit;text-decoration:none}
.site-header{position:fixed;z-index:20;top:0;left:0;width:100%;height:54px;padding:0 var(--pad);
display:flex;align-items:center;background:rgba(9,9,9,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.header-name{font-size:16px}
main{flex:1 0 auto;width:100%;max-width:1000px;margin:0 auto;padding:130px var(--pad) 90px}
.article-meta{font-size:16px;color:var(--muted);margin-bottom:25px}
h1{font-size:64px;line-height:.95;font-weight:400;letter-spacing:0;margin:0 0 56px;max-width:900px}

/* REPRODUCTOR: botón, tiempo y barra; se queda pegado bajo la cabecera al bajar */
.player{position:sticky;top:54px;z-index:10;max-width:760px;display:flex;align-items:center;gap:18px;
padding:18px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:44px}
.play{flex:none;width:44px;height:44px;display:grid;place-items:center;background:none;border:1px solid var(--muted);
cursor:pointer;padding:0;transition:border-color .2s}
.play:hover,.play:focus-visible{border-color:var(--fg);outline:none}
.play i{display:block;width:0;height:0;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent var(--fg);margin-left:3px}
.play.on i{width:12px;height:15px;border:0;margin:0;border-left:4px solid var(--fg);border-right:4px solid var(--fg)}
.time{flex:none;font-size:13px;color:var(--muted);min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.bar{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none;outline:none}
.bar::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--muted)}
.bar .done{position:absolute;left:0;top:50%;height:1px;background:var(--fg);width:0}

[273.5], "e": 275.09}, {"s": 275.09, "p": true, "i": false, "text": "Bueno,", "t": [275.09], "e": 275.73}, {"s": 275.73, "p": false, "i": false, "text": "un caso muy curioso que a mí me plantea un interrogante:", "t": [275.73, 275.95, 276.22, 276.48, 276.89, 277.06, 277.21, 277.41, 277.61, 278.29, 278.52], "e": 279.35}, {"s": 279.35, "p": false, "i": false, "text": "y es que:", "t": [279.35, 279.47, 279.65], "e": 280.08}, {"s": 280.08, "p": false, "i": false, "text": "durante su experiencia cercana a la muerte,", "t": [280.08, 280.38, 280.56, 281.13, 281.5, 281.63, 281.79], "e": 282.42}, {"s": 282.42, "p": false, "i": false, "text": "¿tiene Gregorio la ilusión de haber sido abducido por seres de otro mundo,", "t": [282.42, 282.68, 283.06, 283.24, 283.71, 283.86, 284.13, 284.7, 285.22, 285.42, 285.73, 285.89, 286.11], "e": 287.16}, {"s": 287.16, "p": false, "i": false, "text": "o son los seres de otro mundo quienes le inoculan la ilusión de haber sufrido una ECM?", "t": [287.16, 287.29, 287.54, 287.81, 288.11, 288.26, 288.47, 288.78, 289.14, 289.31, 289.77, 290.39, 290.85, 290.99, 291.26, 291.67, 292.13], "e": 293.27}, {"s": 293.27, "p": true, "i": false, "text": "A día de hoy,", "t": [293.27, 293.38, 293.53, 293.64], "e": 293.78}, {"s": 293.78, "p": false, "i": false, "text": "tras un año del incidente,", "t": [293.78, 293.98, 294.15, 294.34, 294.52], "e": 294.94}, {"s": 294.94, "p": false, "i": false, "text": "el misterio sigue sin resolverse.", "t": [294.94, 295.11, 295.46, 295.68, 295.9], "e": 297.49}, {"s": 297.49, "p": false, "i": false, "text": "Y desde aquello,", "t": [297.49, 297.62, 297.88], "e": 298.24}, {"s": 298.24, "p": false, "i": false, "text": "cada vez que se desata una tormenta eléctrica en el pequeño pueblo de Tornavacas,", "t": [298.24, 298.46, 298.66, 298.82, 299.0, 299.31, 299.49, 299.84, 300.29, 300.81, 301.01, 301.36, 301.66, 301.8], "e": 302.68}, {"s": 302.68, "p": false, "i": false, "text": "se respira cierta congoja,", "t": [302.68, 302.89, 303.28, 303.68], "e": 305.17}, {"s": 305.17, "p": false, "i": false, "text": "un miedo universal a lo desconocido.", "t": [305.17, 305.38, 305.7, 306.25, 306.77, 306.97], "e": 308.56}, {"s": 308.56, "p": false, "i": false, "text": "Sus vecinos ya lo tienen.", "t": [308.56, 308.84, 309.57, 309.79, 309.98], "e": 311.25}, {"s": 311.25, "p": false, "i": false, "text": "¿Y ustedes?", "t": [311.25, 311.47], "e": 312.54}]</script>
<script>
(() => {
  const audio = document.querySelector('audio'), btn = document.querySelector('.play'), bar = document.querySelector('.bar');
  const done = bar.querySelector('.done'), knob = bar.querySelector('.knob');
  const cur = document.querySelector('.cur'), dur = document.querySelector('.dur'), hint = document.querySelector('.hint');
  const box = document.querySelector('.transcript');
  const SEG = JSON.parse(document.getElementById('transcript').textContent);

  // Monta el texto: cada palabra es un <span>; cada palabra sabe en qué segundo aparece
  const words = [], times = [];
  let p = null;
  SEG.forEach((g, gi) => {
    if (!p || g.p) { p = document.createElement('p'); if (g.i) p.className = 'it'; box.appendChild(p); }
    const parts = g.text.split(/(\s+)/).filter(x => x.length);
    const total = parts.reduce((n, x) => n + (/\s/.test(x) ? 0 : x.length), 0) || 1;
    let acc = 0, k = 0;
    parts.forEach(x => {
      if (/^\s+$/.test(x)) { p.appendChild(document.createTextNode(' ')); return; }
      const w = document.createElement('span'); w.className = 'w'; w.textContent = x; p.appendChild(w);
      times.push(g.t ? g.t[k] : g.s + (g.e - g.s) * (acc / total));   // instante de cada palabra (o reparto por longitud)
      acc += x.length; k++; words.push(w);
    });
    if (gi < SEG.length - 1 && !SEG[gi + 1].p) p.appendChild(document.createTextNode(' '));
  });
  const caret = document.createElement('span'); caret.className = 'caret idle';

  let shown = 0;                                                   // cuántas palabras se ven ahora
  const countAt = t => { let lo = 0, hi = times.length; while (lo < hi) { const m = (lo + hi) >> 1; if (times[m] <= t) lo = m + 1; else hi = m; } return lo; };
  let userScroll = -1e9; addEventListener('wheel', () => userScroll = performance.now(), { passive: true }); addEventListener('touchmove', () => userScroll = performance.now(), { passive: true });
  function sync(t) {
    const n = countAt(t);
    if (n > shown) for (let i = shown; i < n; i++) words[i].classList.add('v');
    else for (let i = n; i < shown; i++) words[i].classList.remove('v');   // al volver atrás, el texto se recoge
    if (n !== shown) {
      shown = n;
      if (n > 0) words[n - 1].after(caret); else box.prepend(caret);
      if (!audio.paused && performance.now() - userScroll > 4000) {     // acompaña la lectura si el lector no está moviéndose por su cuenta
        const r = caret.getBoundingClientRect();
        if (r.bottom > innerHeight - 90) scrollBy({ top: r.bottom - innerHeight * 0.55, behavior: 'smooth' });
      }
    }
    hint.hidden = t > 0 || !audio.paused;
  }
  const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function paint(t) {
    const d = audio.duration || 0, f = d ? Math.min(1, t / d) : 0;
    done.style.width = (f * 100) + '%'; knob.style.left = (f * 100) + '%';
    cur.textContent = fmt(t); bar.setAttribute('aria-valuenow', Math.round(t));
  }
  let raf = 0;
  const loop = () => { const t = dragging ? dragT : audio.currentTime; sync(t); paint(t); raf = audio.paused ? 0 : requestAnimationFrame(loop); };
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };

  audio.addEventListener('loadedmetadata', () => { dur.textContent = fmt(audio.duration); bar.setAttribute('aria-valuemax', Math.round(audio.duration)); paint(audio.currentTime); });
  audio.addEventListener('play', () => { btn.classList.add('on'); btn.setAttribute('aria-label', 'Pausa'); caret.classList.remove('idle'); kick(); });
  audio.addEventListener('pause', () => { btn.classList.remove('on'); btn.setAttribute('aria-label', 'Reproducir'); caret.classList.add('idle'); sync(audio.currentTime); paint(audio.currentTime); });
  audio.addEventListener('seeked', () => { sync(audio.currentTime); paint(audio.currentTime); });
  audio.addEventListener('ended', () => { sync(audio.duration); paint(audio.duration); });
  btn.addEventListener('click', () => { if (audio.paused) audio.play(); else audio.pause(); });

  // Barra: clic o arrastre para moverse; flechas del teclado, 5 s
  let dragging = false, dragT = 0;
  const tAt = e => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (audio.duration || 0); };
  bar.addEventListener('pointerdown', e => { if (!audio.duration) return; dragging = true; bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); dragT = tAt(e); sync(dragT); paint(dragT); });
  bar.addEventListener('pointermove', e => { if (!dragging) return; dragT = tAt(e); sync(dragT); paint(dragT); });
  const end = () => { if (!dragging) return; dragging = false; bar.classList.remove('drag'); audio.currentTime = dragT; };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
  bar.addEventListener('keydown', e => {
    if (!audio.duration) return;
    const step = { ArrowRight: 5, ArrowLeft: -5, ArrowUp: 5, ArrowDown: -5, PageUp: 30, PageDown: -30 }[e.key];
    if (step) { e.preventDefault(); audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + step)); }
    if (e.key === 'Home') { e.preventDefault(); audio.currentTime = 0; }
    if (e.key === 'End') { e.preventDefault(); audio.currentTime = audio.duration; }
  });
  addEventListener('keydown', e => {                               // barra espaciadora: play / pausa
    if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); btn.click(); }
  });
  box.prepend(caret); sync(0);
})();
</script>
